<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Portfolio — Bhuvaneswari KP</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  :root {
    --ink: #0d0f14;
    --paper: #f8f6f1;
    --accent: #1a4fff;
    --accent2: #00c2a8;
    --muted: #6b7080;
    --border: #e2ddd6;
    --card: #ffffff;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  nav {
    background: rgba(248,246,241,0.96);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: 0 40px;
    display: flex; align-items: center; justify-content: space-between;
    height: 60px;
    flex-shrink: 0;
  }
  .nav-logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800; font-size: 1.1rem;
    color: var(--ink); text-decoration: none;
  }
  .nav-left { display: flex; align-items: center; gap: 24px; }
  .back-link {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 0.875rem; font-weight: 500;
    color: var(--muted); text-decoration: none;
    transition: color 0.2s;
  }
  .back-link:hover { color: var(--accent); }

  .toolbar {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 12px 40px;
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }
  .toolbar-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem; color: var(--muted);
  }
  .pdf-frame {
    flex: 1;
    width: 100%;
    border: none;
    display: block;
  }

  @media (max-width: 768px) {
    nav { padding: 0 20px; }
    .toolbar { padding: 10px 20px; }
  }
</style>
</head>
<body>

<nav>
  <div class="nav-left">
    <a class="nav-logo" href="index.html">BKP</a>
    <a class="back-link" href="index.html">← Back to Portfolio</a>
  </div>
</nav>

<div class="toolbar">
  <span class="toolbar-title">Bhuvaneswari_KP_Product_Portfolio.pdf</span>
</div>

<iframe
  class="pdf-frame"
  src="Bhuvaneswari_KP_Product_Portfolio.pdf"
  title="Bhuvaneswari KP Product Portfolio">
</iframe>

</body>
</html>
